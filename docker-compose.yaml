services:
  api:
    build:
      context: ./CineCraft
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    depends_on:
      - db
    networks:
      - app-network
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      - api
    networks:
      - app-network
    env_file:
      - .env

  db:
    image: postgres:15-alpine
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    env_file:
      - .env

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge